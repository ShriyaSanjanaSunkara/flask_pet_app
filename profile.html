 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
</head>
<body>
    <h1>Profile of {{ user.username }}</h1>
    <p><strong>Username:</strong> {{ user.username }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>  <!-- Adjust if you have an email field -->
    <p><strong>Joined On:</strong> {{ user.joined_on }}</p>  <!-- Adjust based on your model -->
    <a href="{{ url_for('edit_profile') }}">Edit Profile</a> <!-- Link to edit profile -->
    <a href="{{ url_for('logout') }}">Logout</a>
</body>
</html>
